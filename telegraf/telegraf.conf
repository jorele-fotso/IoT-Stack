# Telegraf - copies the MQTT messages of the ESP32 into InfluxDB
# Topic pattern: elderly/<room>/<part>  e.g. elderly/room1/air
# Message: JSON with numbers, e.g. {"co2_ppm": 812, "temperature_c": 22.4}

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# ---------- Input: read from Mosquitto ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["elderly/+/+"]
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  client_id = "telegraf"
  # If Mosquitto is not ready yet, keep retrying instead of stopping
  startup_error_behavior = "retry"
  qos = 0
  data_format = "json"
  # Text values (JSON strings) are dropped unless listed here
  json_string_fields = ["badge_uid", "medication"]

  # elderly/room1/air -> measurement "air", tag room="room1"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "elderly/+/+"
    measurement = "_/_/measurement"
    tags = "_/room/_"

# ---------- Output: write into InfluxDB ----------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
