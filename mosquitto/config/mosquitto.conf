# Mosquitto MQTT broker - Vitals & Air Monitoring
# Owner: Noé (temporary version prepared by Jorèle)

# Listen on the standard MQTT port (no encryption, school prototype)
listener 1883

# Only known users can connect (users are created from .env at start-up)
allow_anonymous false
password_file /mosquitto/data/passwd

# Keep queued messages if the broker restarts
persistence true
persistence_location /mosquitto/data/

# Show the logs in "docker compose logs mosquitto"
log_dest stdout
